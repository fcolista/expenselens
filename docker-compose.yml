services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-expenselens}
      POSTGRES_USER: ${POSTGRES_USER:-expenselens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-expenselens} -d ${POSTGRES_DB:-expenselens}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  migrate:
    image: ${EXPENSELENS_REGISTRY:-ghcr.io/fcolista}/expenselens-backend:${EXPENSELENS_VERSION:-latest}
    build:
      context: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]
    restart: "no"

  api:
    image: ${EXPENSELENS_REGISTRY:-ghcr.io/fcolista}/expenselens-backend:${EXPENSELENS_VERSION:-latest}
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      SECURE_COOKIES: ${SECURE_COOKIES:-true}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8080}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-ExpenseLens}
      RATES_PROVIDER: ${RATES_PROVIDER:-}
      STORAGE_DIR: /data/documents
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-12582912}
      OCR_PROVIDER: ${OCR_PROVIDER:-tesseract}
      VISION_API_URL: ${VISION_API_URL:-}
      VISION_API_KEY: ${VISION_API_KEY:-}
      VISION_MODEL: ${VISION_MODEL:-}
      AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT: ${AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT:-}
      AZURE_DOCUMENT_INTELLIGENCE_KEY: ${AZURE_DOCUMENT_INTELLIGENCE_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    volumes:
      - documents:/data/documents
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [internal]

  web:
    image: ${EXPENSELENS_REGISTRY:-ghcr.io/fcolista}/expenselens-web:${EXPENSELENS_VERSION:-latest}
    build:
      context: ./frontend
    restart: unless-stopped
    networks: [internal]

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-:80}
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api, web]
    networks: [internal]

  telegram-worker:
    image: ${EXPENSELENS_REGISTRY:-ghcr.io/fcolista}/expenselens-backend:${EXPENSELENS_VERSION:-latest}
    build:
      context: ./backend
    command: ["python", "-m", "app.telegram_bot"]
    restart: unless-stopped
    profiles: ["telegram"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_NOTIFY_HOUR: ${TELEGRAM_NOTIFY_HOUR:-8}
      TZ: ${TZ:-Europe/Rome}
      STORAGE_DIR: /data/documents
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-12582912}
      OCR_PROVIDER: ${OCR_PROVIDER:-tesseract}
      VISION_API_URL: ${VISION_API_URL:-}
      VISION_API_KEY: ${VISION_API_KEY:-}
      VISION_MODEL: ${VISION_MODEL:-}
      AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT: ${AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT:-}
      AZURE_DOCUMENT_INTELLIGENCE_KEY: ${AZURE_DOCUMENT_INTELLIGENCE_KEY:-}
    volumes:
      - documents:/data/documents
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [internal]

  backup:
    image: ${EXPENSELENS_REGISTRY:-ghcr.io/fcolista}/expenselens-backup:${EXPENSELENS_VERSION:-latest}
    build:
      context: ./backup
    restart: unless-stopped
    user: "${BACKUP_UID:-1000}:${BACKUP_GID:-1000}"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    environment:
      TZ: ${TZ:-Europe/Rome}
      POSTGRES_DB: ${POSTGRES_DB:-expenselens}
      POSTGRES_USER: ${POSTGRES_USER:-expenselens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      BACKUP_ENABLED: ${BACKUP_ENABLED:-true}
      BACKUP_TIME: ${BACKUP_TIME:-03:30}
      BACKUP_DIR: ${BACKUP_DIR:-/backups}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
      BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-6}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_AGE_IDENTITY_FILE: ${BACKUP_AGE_IDENTITY_FILE:-}
      BACKUP_REMOTE: ${BACKUP_REMOTE:-}
      BACKUP_ALLOW_UNENCRYPTED_REMOTE: ${BACKUP_ALLOW_UNENCRYPTED_REMOTE:-false}
      BACKUP_REMOTE_KEEP_DAYS: ${BACKUP_REMOTE_KEEP_DAYS:-30}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-expenselens}
      BACKUP_S3_PROVIDER: ${BACKUP_S3_PROVIDER:-}
      BACKUP_WEBDAV_URL: ${BACKUP_WEBDAV_URL:-}
      BACKUP_WEBDAV_USER: ${BACKUP_WEBDAV_USER:-}
      BACKUP_WEBDAV_PASSWORD: ${BACKUP_WEBDAV_PASSWORD:-}
      BACKUP_WEBDAV_VENDOR: ${BACKUP_WEBDAV_VENDOR:-}
      BACKUP_WEBDAV_PATH: ${BACKUP_WEBDAV_PATH:-expenselens}
      BACKUP_VERIFY_DAY: ${BACKUP_VERIFY_DAY-sun}
      BACKUP_VERIFY_TIME: ${BACKUP_VERIFY_TIME:-05:00}
      BACKUP_ALERT_TELEGRAM_CHAT_ID: ${BACKUP_ALERT_TELEGRAM_CHAT_ID:-}
      BACKUP_NOTIFY_SUCCESS: ${BACKUP_NOTIFY_SUCCESS:-false}
      BACKUP_LANG: ${BACKUP_LANG:-it}
    volumes:
      - documents:/data/documents:ro
      - ./backups:/backups
      # To allow full restore verification of encrypted backups, mount the PRIVATE
      # age key read-only and set BACKUP_AGE_IDENTITY_FILE=/run/secrets/age_identity:
      # - /percorso/sicuro/age-key.txt:/run/secrets/age_identity:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "/app/agent.py", "health"]
      interval: 5m
      timeout: 15s
      retries: 3
      start_period: 30s
    networks: [internal]

volumes:
  postgres_data:
  documents:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
